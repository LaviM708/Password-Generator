<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="container">
      <h1>Password Generator</h1>

      <!-- password container -->
      <div class="password-container">
        <input type="text" readonly id="password" />
        <i class="far fa-copy" id="copy-btn" title="Copy to Clipboard"></i>
      </div>

      <!-- options -->
      <div class="options">
        <!-- password length -->
        <div class="option">
          <label for="length">Password Length</label>
          <div class="range-container">
            <input type="range" id="length" min="6" max="24" value="12" />
            <span id="length-value">12</span>
          </div>
        </div>

        <!-- include uppercase -->
        <div class="option">
          <label for="uppercase">Inlcude Uppercase</label>
          <input type="checkbox" id="uppcase" checked />
        </div>

        <!-- include lowercase -->
        <div class="option">
          <label for="lowercase">Inlcude lowercase</label>
          <input type="checkbox" id="lowercase" checked />
        </div>

        <!-- include numbers -->
        <div class="option">
          <label for="numbers">Inlcude numbers</label>
          <input type="checkbox" id="numbers" checked />
        </div>

        <!-- include symbols -->
        <div class="option">
          <label for="symbols">Inlcude symbols</label>
          <input type="checkbox" id="symbols" checked />
        </div>
      </div>

      <button id="generate-btn">
        <i class="fas fa-key"></i>
        Generate Password
      </button>

      <div class="strength-container">
        <p>Password Strength: <span id="strength-label">Medium</span></p>

        <div class="strength-meter">
          <div class="strength-bar"></div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
